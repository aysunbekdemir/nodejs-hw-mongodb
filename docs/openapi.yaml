openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts Management API
  description: API for managing contacts with authentication
servers:
  - url: http://localhost:4000
  - url: https://your-app.onrender.com
paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Successfully registered
        '409':
          description: Email already in use

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successfully logged in
        '401':
          description: Unauthorized

  /api/contacts:
    get:
      tags:
        - Contacts
      summary: Get all contacts
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: perPage
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Successfully found contacts
        '401':
          description: Unauthorized

    post:
      tags:
        - Contacts
      summary: Create a new contact
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - phoneNumber
                - contactType
              properties:
                name:
                  type: string
                phoneNumber:
                  type: string
                email:
                  type: string
                contactType:
                  type: string
                  enum: [work, home, personal]
                isFavourite:
                  type: boolean
                photo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Successfully created a contact
        '401':
          description: Unauthorized

  /api/contacts/{contactId}:
    get:
      tags:
        - Contacts
      summary: Get contact by ID
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully found contact
        '404':
          description: Contact not found

    patch:
      tags:
        - Contacts
      summary: Update contact
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                phoneNumber:
                  type: string
                email:
                  type: string
                contactType:
                  type: string
                  enum: [work, home, personal]
                isFavourite:
                  type: boolean
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Successfully updated contact
        '404':
          description: Contact not found

    delete:
      tags:
        - Contacts
      summary: Delete contact
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Contact deleted successfully
        '404':
          description: Contact not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
